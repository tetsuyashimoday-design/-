<style>
/* ============================================================
   グローバルスタイル
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
  background: #f5f7fb;
  color: #333;
  font-size: 14px;
}
#app {
  display: flex;
  min-height: 100vh;
}

/* ============================================================
   サイドバー
   ============================================================ */
.sidebar {
  width: 240px;
  background: #1a237e;
  color: #fff;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s;
}
.sidebar-header {
  padding: 20px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  font-weight: bold;
  font-size: 13px;
}
.logo { font-size: 24px; }
.nav-list { flex: 1; padding: 8px 0; overflow-y: auto; list-style: none; }
.nav-link {
  display: block;
  padding: 12px 20px;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 0;
  text-decoration: none;
  font-size: 13px;
}
.nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-link.active { background: rgba(255,255,255,0.2); color: #fff; border-left: 3px solid #fff; }
.sidebar-user {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.15);
}
.user-name { font-weight: bold; font-size: 13px; }
.user-role { font-size: 11px; opacity: 0.7; margin-top: 2px; }

/* ============================================================
   メインコンテンツ
   ============================================================ */
.main-content {
  margin-left: 240px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.topbar {
  background: #fff;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  position: sticky;
  top: 0;
  z-index: 50;
}
.menu-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  display: none;
  color: #333;
}
.page-title { font-size: 18px; font-weight: bold; color: #1a237e; }
.content-area { padding: 24px; flex: 1; }

/* ============================================================
   カード・共通コンポーネント
   ============================================================ */
.card {
  background: #fff;
  border-radius: 10px;
  padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}
.card-title {
  font-size: 15px;
  font-weight: bold;
  color: #1a237e;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid #e8eaf6;
}
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

.stat-card {
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  text-align: center;
}
.stat-value { font-size: 36px; font-weight: bold; color: #1a237e; }
.stat-label { font-size: 12px; color: #666; margin-top: 4px; }
.stat-card.danger .stat-value { color: #c62828; }
.stat-card.warning .stat-value { color: #e65100; }
.stat-card.success .stat-value { color: #2e7d32; }

/* ============================================================
   フォーム
   ============================================================ */
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; }
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #1a237e;
  box-shadow: 0 0 0 3px rgba(26,35,126,0.1);
}
textarea { min-height: 120px; resize: vertical; }

/* ============================================================
   ボタン
   ============================================================ */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  font-weight: 500;
}
.btn-primary { background: #1a237e; color: #fff; }
.btn-primary:hover { background: #283593; }
.btn-success { background: #2e7d32; color: #fff; }
.btn-success:hover { background: #388e3c; }
.btn-warning { background: #e65100; color: #fff; }
.btn-warning:hover { background: #f57c00; }
.btn-danger { background: #c62828; color: #fff; }
.btn-danger:hover { background: #d32f2f; }
.btn-outline {
  background: transparent;
  border: 1px solid #1a237e;
  color: #1a237e;
}
.btn-outline:hover { background: #e8eaf6; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================================================
   テーブル
   ============================================================ */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  background: #e8eaf6;
  padding: 10px 12px;
  text-align: left;
  font-size: 12px;
  color: #1a237e;
  white-space: nowrap;
}
td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #f9f9ff; }

/* ============================================================
   バッジ・ステータス
   ============================================================ */
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
}
.badge-open { background: #fff3e0; color: #e65100; }
.badge-pending { background: #e3f2fd; color: #1565c0; }
.badge-issued { background: #e8f5e9; color: #2e7d32; }
.badge-resolved { background: #f3e5f5; color: #6a1b9a; }
.badge-escalated { background: #ffebee; color: #c62828; }
.badge-scheduled { background: #e3f2fd; color: #1565c0; }
.badge-completed { background: #e8f5e9; color: #2e7d32; }
.badge-draft { background: #fafafa; color: #666; border: 1px solid #ddd; }
.badge-approved { background: #e8f5e9; color: #2e7d32; }

/* ============================================================
   モーダル
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-title {
  font-size: 16px;
  font-weight: bold;
  color: #1a237e;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid #e8eaf6;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #f0f0f0;
}

/* ============================================================
   アラート
   ============================================================ */
.alert {
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 13px;
}
.alert-danger { background: #ffebee; border-left: 4px solid #c62828; color: #c62828; }
.alert-warning { background: #fff3e0; border-left: 4px solid #e65100; color: #e65100; }
.alert-success { background: #e8f5e9; border-left: 4px solid #2e7d32; color: #2e7d32; }
.alert-info { background: #e3f2fd; border-left: 4px solid #1565c0; color: #1565c0; }

/* ============================================================
   文字起こし・録音UI
   ============================================================ */
.transcription-area {
  position: relative;
}
.recording-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: #ffebee;
  border-radius: 20px;
  font-size: 12px;
  color: #c62828;
  margin-bottom: 8px;
}
.recording-dot {
  width: 8px; height: 8px;
  background: #c62828;
  border-radius: 50%;
  animation: blink 1s infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}
.ai-summary-box {
  background: linear-gradient(135deg, #e8eaf6, #e3f2fd);
  border: 1px solid #9fa8da;
  border-radius: 8px;
  padding: 16px;
  margin-top: 12px;
}
.ai-summary-label {
  font-size: 11px;
  font-weight: bold;
  color: #1a237e;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ============================================================
   プログレスバー（人員充足）
   ============================================================ */
.progress-bar {
  background: #e0e0e0;
  border-radius: 10px;
  height: 12px;
  overflow: hidden;
  margin-top: 4px;
}
.progress-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.5s ease;
}
.progress-good { background: #4caf50; }
.progress-warning { background: #ff9800; }
.progress-danger { background: #f44336; }

/* ============================================================
   レスポンシブ
   ============================================================ */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .menu-btn { display: block; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
}

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
  color: #999;
  font-size: 15px;
}
.loading::before {
  content: '';
  width: 24px; height: 24px;
  border: 3px solid #e0e0e0;
  border-top-color: #1a237e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tabs {
  display: flex;
  border-bottom: 2px solid #e8eaf6;
  margin-bottom: 20px;
  gap: 0;
}
.tab {
  padding: 10px 20px;
  cursor: pointer;
  color: #666;
  font-size: 13px;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  margin-bottom: -2px;
}
.tab.active { color: #1a237e; border-bottom-color: #1a237e; font-weight: bold; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.section-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.empty-state {
  text-align: center;
  padding: 40px;
  color: #999;
  font-size: 14px;
}
</style>
